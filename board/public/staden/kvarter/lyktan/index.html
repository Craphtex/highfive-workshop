<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Svärmen · lyktan</title>
<style>
  :root { --bg:#0b0d10; --panel:#12151a; --line:#1f242c; --fg:#e6e8eb; --dim:#7d8590; --accent:#ffb454;
          --lev:#5fd7a7; --fall:#d17a7a; --valt:#8ab4ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:12px/1.35 ui-monospace, Menlo, monospace;
         height:100vh; display:flex; flex-direction:column; overflow:hidden; }

  header { display:flex; align-items:baseline; gap:6px; padding:6px 9px; border-bottom:1px solid var(--line);
           flex:none; flex-wrap:nowrap; overflow:hidden; }
  header b { color:var(--accent); font-size:11px; letter-spacing:.1em; text-transform:uppercase; white-space:nowrap; flex:none; }
  header .sub { color:var(--dim); font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1 1 auto; min-width:0; }
  header .takt { color:var(--dim); font-size:10px; white-space:nowrap; flex:none; }
  header .takt.trängt { color:var(--accent); }
  header .takt b { color:inherit; font-size:10px; letter-spacing:0; text-transform:none; }

  .rad { padding:5px 9px; border-bottom:1px solid var(--line); flex:none; }
  .etikett { color:var(--dim); font-size:9px; letter-spacing:.12em; text-transform:uppercase; margin-bottom:3px; }

  #levande { display:flex; gap:5px; flex-wrap:wrap; min-height:19px; }
  .kap { border:1px solid var(--lev); color:var(--lev); border-radius:999px; padding:1px 8px; font-size:11px;
         animation:puls 1.1s ease-in-out infinite; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .kap i { color:var(--dim); font-style:normal; }
  @keyframes puls { 0%,100% { opacity:1; box-shadow:0 0 0 0 rgba(95,215,167,.5); } 50% { opacity:.62; box-shadow:0 0 0 3px rgba(95,215,167,0); } }
  .sover { color:var(--dim); font-size:11px; }

  main { flex:1 1 auto; overflow-y:auto; overflow-x:hidden; padding:5px 9px 8px; min-height:0; }
  .u { border-left:2px solid var(--line); padding:3px 0 5px 7px; margin-bottom:5px; }
  .u.fallet { border-left-color:var(--fall); } .u.valt { border-left-color:var(--valt); }
  .u .top { display:flex; gap:6px; align-items:baseline; }
  .u .sort { color:var(--accent); font-size:11px; }
  .u .fr { color:var(--dim); font-size:10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1 1 auto; min-width:0; }
  .u .m { font-size:9px; padding:0 4px; border-radius:3px; border:1px solid var(--line); color:var(--dim); flex:none; }
  .u.fallet .m { color:var(--fall); border-color:var(--fall); }
  .u.valt .m { color:var(--valt); border-color:var(--valt); }
  .u .txt { font-size:10.5px; color:#c3c8cf; margin-top:2px; }
  .u .varför { font-size:10px; color:var(--fall); margin-top:2px; }
  .tom { color:var(--dim); font-size:11px; padding:10px 0; }

  /* /staden lägger kvarterets namn i nedre vänstra hörnet ovanpå oss — håll hörnet tomt. */
  #lärdomar { flex:none; padding-bottom:22px; }
  main:last-child { padding-bottom:24px; }
  #lärdomar ul { margin:0; padding:0; list-style:none; }
  #lärdomar li { font-size:10px; color:var(--dim); margin-bottom:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #lärdomar li b { color:var(--accent); font-weight:400; }

  .frm { display:flex; gap:5px; padding:5px 9px; border-bottom:1px solid var(--line); flex:none; align-items:center; }
  input { flex:1 1 auto; min-width:60px; background:var(--panel); border:1px solid var(--line); color:var(--fg);
          border-radius:5px; padding:3px 7px; font:inherit; font-size:11px; }
  input:focus { outline:none; border-color:var(--accent); }
  button { background:var(--panel); border:1px solid var(--line); color:var(--dim); border-radius:5px;
           padding:3px 8px; font:inherit; font-size:10px; cursor:pointer; flex:none; }
  button:hover { color:var(--fg); border-color:var(--accent); }
  #prov { padding:5px 9px; border-bottom:1px solid var(--line); font-size:10px; flex:none; display:none; }
  #prov .h { color:var(--dim); } #prov .h b { color:var(--accent); font-weight:400; }
  #prov .t { color:#c3c8cf; margin-top:2px; }
</style>
</head>
<body>

<header>
  <b>Svärmen</b>
  <span class="sub">attention-huvud</span>
  <span class="takt" id="takt"></span>
</header>

<!-- Ingen <form>: /staden bäddar in oss med sandbox="allow-scripts allow-same-origin", utan
     allow-forms, och då sväljer webbläsaren submit-händelsen. Knapp och Enter i stället. -->
<div class="frm">
  <input id="q" placeholder="prova en fråga — torrkörning" title="Visar vilket huvud som hade vaknat. Postar ingenting på pulsen." maxlength="180">
  <button id="knapp" type="button" title="Torrkörning, postar inget">vilket huvud?</button>
</div>
<div id="prov"></div>

<div class="rad">
  <div class="etikett">Levande kapabiliteter</div>
  <div id="levande"><span class="sover">svärmen sover — ingen fråga på pulsen</span></div>
</div>

<main id="lista"><div class="tom">Inga delsvar än. Vi vaknar av en {typ:"fråga"} på #staden-puls.</div></main>

<div class="rad" id="lärdomar" hidden>
  <div class="etikett">Lärdomar från kyrkogården</div>
  <ul id="lärdomarLista"></ul>
</div>


<script>
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function ritaLevande(levande) {
  const el = document.getElementById('levande');
  if (!levande.length) { el.innerHTML = '<span class="sover">svärmen sover — ingen fråga på pulsen</span>'; return; }
  el.innerHTML = levande.map(k =>
    `<span class="kap" title="${esc(k.fråga.text)}">${esc(k.sort)} <i>↩${esc(k.fråga.id)}</i></span>`
  ).join('');
}

const märken = { valt: 'valt av staden', fallet: 'på kyrkogården', okänt: 'väntar på dom', 'ej postat': 'ej postat', avbrutet: 'avbrutet' };

function ritaUpplösta(upplösta, avstådda) {
  const el = document.getElementById('lista');
  const poster = [
    ...upplösta.map(p => ({ när: p.upplöst, html: `
      <div class="u ${esc(p.utfall)}">
        <div class="top">
          <span class="sort">${esc(p.sort)}</span>
          <span class="fr">↩${esc(p.fråga.id)} ${esc(p.fråga.text)}</span>
          <span class="m">${esc(märken[p.utfall] || p.utfall)}</span>
        </div>
        <div class="txt">${esc(p.text || '')}</div>
        ${p.varför ? `<div class="varför">skäl: ${esc(p.varför)}</div>` : ''}
      </div>` })),
    ...avstådda.map(a => ({ när: a.när, html: `
      <div class="u">
        <div class="top">
          <span class="sort">—</span>
          <span class="fr">↩${esc(a.fråga)} ingen kapabilitet spawnades</span>
          <span class="m">avstod</span>
        </div>
        <div class="varför">${esc(a.skäl)}</div>
      </div>` })),
  ].sort((a, b) => b.när - a.när);

  el.innerHTML = poster.length
    ? poster.map(p => p.html).join('')
    : '<div class="tom">Inga delsvar än. Vi vaknar av en {typ:"fråga"} på #staden-puls.</div>';
}

function ritaLärdomar(lärdomar) {
  const rader = Object.entries(lärdomar || {}).flatMap(([sort, l]) => l.map(x => ({ sort, ...x })));
  const box = document.getElementById('lärdomar');
  box.hidden = !rader.length;
  document.getElementById('lärdomarLista').innerHTML = rader.slice(0, 4).map(r =>
    `<li title="${esc(r.varför)}"><b>${esc(r.sort)}</b> föll: ${esc(r.varför)}</li>`
  ).join('');
}

function ritaTakt(t, r) {
  const el = document.getElementById('takt');
  el.textContent = `${r.delsvar}↑ ${r.valda}✓ ${r.fallna}† ${t.använt}/${t.egetTak}`;
  el.title = `${r.delsvar} postade delsvar, ${r.valda} valda av staden, ${r.fallna} på kyrkogården. `
           + `Taktbudget: ${t.använt} av våra ${t.egetTak} den här minuten (serverns tak är ${t.serverTak}).`;
  el.classList.toggle('trängt', t.använt >= t.egetTak);
}

let senast = 0;
async function uppdatera() {
  const nu = Date.now();
  if (nu - senast < 400) return;      // slå inte ihjäl backenden när SSE och timer råkar sammanfalla
  senast = nu;
  try {
    const s = await fetch('/t/lyktan/status', { cache: 'no-store' }).then(r => r.json());
    ritaLevande(s.levande || []);
    ritaUpplösta(s.upplösta || [], s.avstådda || []);
    ritaLärdomar(s.lärdomar);
    ritaTakt(s.takt, s.räknare);
  } catch {}
}

uppdatera();
setInterval(uppdatera, 3000);

// Pulsen ger oss anledning att rita om direkt, inte bara var tredje sekund.
try {
  const es = new EventSource('/api/stream?channel=staden-puls');
  es.onmessage = () => { setTimeout(uppdatera, 120); setTimeout(uppdatera, 1500); };
} catch {}

// Torrkörning: visar vilket huvud som hade vaknat. Postar ingenting på pulsen.
async function torrkör() {
  const q = document.getElementById('q').value.trim();
  const box = document.getElementById('prov');
  if (!q) return;
  box.style.display = 'block';
  box.innerHTML = '<span class="h">torrkör…</span>';
  try {
    const r = await fetch('/t/lyktan/prova?fraga=' + encodeURIComponent(q)).then(r => r.json());
    if (r.error) { box.innerHTML = `<span class="h">${esc(r.error)}</span>`; return; }
    box.innerHTML = `<div class="h">hade spawnat <b>${esc(r.sort)}</b> · inget postat på pulsen</div>
                     <div class="t">${esc(r.text)}</div>`;
  } catch {
    box.innerHTML = '<span class="h">backenden svarade inte</span>';
  }
}

document.getElementById('knapp').addEventListener('click', torrkör);
document.getElementById('q').addEventListener('keydown', ev => {
  if (ev.key === 'Enter') { ev.preventDefault(); torrkör(); }
});
</script>
</body>
</html>
